views:
  - type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Calendario Gare
            heading_style: title
          - type: custom:button-card
            entity: sensor.f1_current_season
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - background: 'linear-gradient(180deg, #1c1c2e, #121220)'
                - border-radius: 16px
                - padding: 12px
                - color: white
              grid:
                - grid-template-areas: '"title" "list"'
                - grid-template-columns: 1fr
              custom_fields:
                title:
                  - font-size: 24px
                  - font-weight: 800
                  - letter-spacing: 1px
                  - text-transform: uppercase
                  - padding: 4px 0 10px
                  - border-bottom: 1px solid rgba(255,255,255,0.25)
                  - margin-bottom: 10px
            custom_fields:
              title: 📅 Race Calendar
              list: |
                [[[
                  const PREV = 1;   // gare già corse da mostrare
                  const NEXT = 2;   // prossime gare da mostrare

                  const a = entity?.attributes || {};
                  const races = a.races || a.race_schedule || a.calendar || a.Races || a.data || [];
                  if (!races.length) return '<div style="opacity:.7">Nessun dato disponibile</div>';

                  const iso = {
                    'Australia':'au','China':'cn','Japan':'jp','Bahrain':'bh','Saudi Arabia':'sa',
                    'USA':'us','United States':'us','Italy':'it','Monaco':'mc','Spain':'es',
                    'Canada':'ca','Austria':'at','UK':'gb','United Kingdom':'gb','Great Britain':'gb',
                    'Belgium':'be','Hungary':'hu','Netherlands':'nl','Azerbaijan':'az',
                    'Singapore':'sg','Mexico':'mx','Brazil':'br','Qatar':'qa','UAE':'ae',
                    'United Arab Emirates':'ae','Abu Dhabi':'ae','Portugal':'pt','France':'fr',
                    'Germany':'de','Turkey':'tr','Russia':'ru','Vietnam':'vn','South Africa':'za'
                  };

                  const when = r => new Date(`${r.date}T${r.time || '12:00:00Z'}`);
                  const now = new Date();
                  let idx = races.findIndex(r => when(r).getTime() + 3 * 3600e3 > now.getTime());
                  if (idx < 0) idx = races.length;
                  const from = Math.max(0, idx - PREV);
                  const shown = races.slice(from, idx + NEXT);

                  const mesi = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];

                  return shown.map((r, i) => {
                    const d = when(r);
                    const past = from + i < idx;
                    const isNext = from + i === idx;
                    const loc = r.Circuit?.Location || {};
                    const cc = iso[loc.country] || '';
                    const flag = cc
                      ? `<img src="https://flagcdn.com/w80/${cc}.png" style="width:30px;height:20px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.25)">`
                      : '';
                    const ora = d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Rome' });
                    const giorno = d.toLocaleDateString('it-IT', { day: '2-digit', timeZone: 'Europe/Rome' });
                    const mese = mesi[Number(d.toLocaleDateString('en-US', { month: 'numeric', timeZone: 'Europe/Rome' })) - 1];
                    const sub = [loc.locality, r.Sprint ? 'sprint' : '', isNext ? 'prossima gara' : '']
                      .filter(Boolean).join(' · ');

                    return `
                      <div style="display:grid;grid-template-columns:48px 34px 1fr auto;align-items:center;
                                  gap:10px;margin-bottom:6px;padding:6px 10px;border-radius:10px;
                                  ${past ? 'opacity:.5;' : ''}
                                  background:${isNext ? 'linear-gradient(90deg,#e1060066,#e1060010 70%,transparent)' : 'rgba(255,255,255,.04)'}">
                        <div style="text-align:center;border-radius:8px;padding:4px 0;background:rgba(255,255,255,.08)">
                          <div style="font-size:20px;font-weight:700;line-height:1.1">${giorno}</div>
                          <div style="font-size:11px;opacity:.75">${mese}</div>
                        </div>
                        <div>${flag}</div>
                        <div style="text-align:left;line-height:1.2;overflow:hidden">
                          <div style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;
                                      text-overflow:ellipsis">${(r.raceName || '').replace('Grand Prix', 'GP')}</div>
                          <div style="font-size:12px;opacity:.75">${sub}</div>
                        </div>
                        <div style="font-size:15px;font-weight:700;white-space:nowrap">
                          ${past ? '🏁' : ora}
                        </div>
                      </div>`;
                  }).join('');
                ]]]
          - type: heading
            icon: ''
            heading: Mappa del circuito
            heading_style: title
          - type: custom:button-card
            entity: sensor.f1_next_race
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - background: 'linear-gradient(180deg, #1c1c2e, #121220)'
                - border-radius: 16px
                - padding: 12px
                - color: white
              grid:
                - grid-template-areas: '"title" "map"'
                - grid-template-columns: 1fr
              custom_fields:
                title:
                  - padding: 2px 0 8px
                  - margin-bottom: 8px
                  - border-bottom: 1px solid rgba(255,255,255,0.2)
            custom_fields:
              title: |
                [[[
                  const a = entity?.attributes || {};
                  const name = String(a.race_name || 'Prossima gara').replace('Grand Prix', 'GP');
                  const flag = a.country_flag_url
                    ? `<img src="${a.country_flag_url}" style="width:30px;height:20px;object-fit:cover;border-radius:3px">` : '';
                  return `<div style="display:flex;align-items:center;gap:10px">${flag}
                      <div style="text-align:left">
                        <div style="font-size:20px;font-weight:800">${name}</div>
                        <div style="font-size:12px;opacity:.75">${a.circuit_name || ''}${a.circuit_locality ? ' · ' + a.circuit_locality : ''}</div>
                      </div></div>`;
                ]]]
              map: |
                [[[
                  const a = entity?.attributes || {};
                  const fromSensor = a.circuit_map_url || a.circuit_map || a.track_map || a.circuit_image;

                  // Nome file usato da formula1.com per le mappe dei circuiti
                  const f1Name = {
                    'Australia':'Australia', 'China':'China', 'Japan':'Japan', 'Bahrain':'Bahrain',
                    'Saudi Arabia':'Saudi_Arabia', 'USA':'USA', 'United States':'USA', 'Italy':'Italy',
                    'Monaco':'Monoco', 'Spain':'Spain', 'Canada':'Canada', 'Austria':'Austria',
                    'UK':'Great_Britain', 'United Kingdom':'Great_Britain', 'Belgium':'Belgium',
                    'Hungary':'Hungary', 'Netherlands':'Netherlands', 'Azerbaijan':'Baku',
                    'Singapore':'Singapore', 'Mexico':'Mexico', 'Brazil':'Brazil', 'Qatar':'Qatar',
                    'UAE':'Abu_Dhabi', 'United Arab Emirates':'Abu_Dhabi'
                  };
                  // Paesi con più GP: distingue per città
                  const byCity = { 'Miami':'Miami', 'Las Vegas':'Las_Vegas', 'Imola':'Emilia_Romagna',
                                   'Madrid':'Madrid' };
                  const key = byCity[a.circuit_locality] || f1Name[a.circuit_country];
                  const fromF1 = key
                    ? `https://media.formula1.com/content/dam/fom-website/2018-redesign-assets/Circuit%20maps%2016x9/${key}_Circuit.png`
                    : '';

                  const fallback = fromF1 && fromSensor ? fromF1 : '';
                  const src = fromSensor || fromF1;
                  const none = '<div style="opacity:.7;text-align:center;padding:16px">Mappa non disponibile</div>';
                  if (!src) return none;
                  return `<img src="${src}" style="width:100%;height:auto;display:block;border-radius:10px"
                            onerror="if('${fallback}' && this.src!=='${fallback}'){this.src='${fallback}'}
                                     else{this.style.display='none';this.nextElementSibling.style.display='block'}">
                          <div style="display:none;opacity:.7;text-align:center;padding:16px">Mappa non disponibile</div>`;
                ]]]
          - type: heading
            icon: ''
            heading: Dettagli Gara
            heading_style: title
          - type: custom:button-card
            entity: sensor.f1_session_status
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - background: 'linear-gradient(180deg, #1c1c2e, #121220)'
                - border-radius: 16px
                - padding: 12px
                - color: white
              grid:
                - grid-template-areas: '"main"'
                - grid-template-columns: 1fr
              custom_fields: null
            custom_fields:
              main: |
                [[[
                  const roster = states['sensor.f1_driver_list']?.attributes?.drivers || [];
                  const byNum = {}, byTla = {};
                  roster.forEach(r => {
                    if (r.racing_number != null) byNum[String(r.racing_number)] = r;
                    if (r.tla) byTla[String(r.tla).toUpperCase()] = r;
                  });
                  const toList = v => Array.isArray(v) ? v
                    : (v && typeof v === 'object')
                      ? Object.entries(v).map(([k, x]) => (x && typeof x === 'object') ? { _key: k, ...x } : { _key: k, value: x })
                      : [];
                  const pick = (o, ...keys) => { for (const k of keys) if (o && o[k] != null && o[k] !== '') return o[k]; return undefined; };
                  const who = o => {
                    const t = String(pick(o, 'tla', 'driver_tla', 'code', 'driver') || '').toUpperCase();
                    const n = String(pick(o, 'racing_number', 'driver_number', 'number', 'car', 'car_number', '_key') ?? '');
                    return byTla[t] || byNum[n] || byTla[n.toUpperCase()] || { tla: t.length === 3 ? t : n };
                  };
                  const col = r => r?.team_color ? '#' + String(r.team_color).replace('#', '') : '#888888';
                  const tag = r => `<span style="display:inline-flex;align-items:center;gap:6px">
                      <span style="width:4px;height:16px;border-radius:2px;background:${col(r)}"></span>
                      <span style="font-weight:700;color:${col(r)}">${r.tla || '?'}</span></span>`;
                  const firstList = (a, ...keys) => { for (const k of keys) { const l = toList(a[k]); if (l.length) return l; } return []; };
                  const none = '<div style="opacity:.7;text-align:center;padding:8px">Nessun dato disponibile</div>';
                  const row = (inner, extra = '') => `<div style="display:grid;align-items:center;gap:6px;padding:6px 10px;
                      margin-bottom:5px;border-radius:10px;background:rgba(255,255,255,.05);${extra}">${inner}</div>`;

                  const S = id => states[id] || {};
                  const nr = S('sensor.f1_next_race').attributes || {};
                  const name = (pick(nr, 'race_name', 'raceName', 'name') || 'Grand Prix').replace('Grand Prix', 'GP');
                  const country = pick(nr, 'country', 'circuit_country') || nr.Circuit?.Location?.country || '';
                  const iso = { 'Australia':'au','China':'cn','Japan':'jp','Bahrain':'bh','Saudi Arabia':'sa','USA':'us',
                    'United States':'us','Italy':'it','Monaco':'mc','Spain':'es','Canada':'ca','Austria':'at','UK':'gb',
                    'United Kingdom':'gb','Great Britain':'gb','Belgium':'be','Hungary':'hu','Netherlands':'nl',
                    'Azerbaijan':'az','Singapore':'sg','Mexico':'mx','Brazil':'br','Qatar':'qa','UAE':'ae',
                    'United Arab Emirates':'ae','Abu Dhabi':'ae','Portugal':'pt' };
                  const cc = iso[country];
                  const flag = cc ? `<img src="https://flagcdn.com/w80/${cc}.png" style="width:34px;height:23px;object-fit:cover;border-radius:3px">` : '';

                  const sess = String(S('sensor.f1_current_session').state || '—').toUpperCase();
                  const st = String(S('sensor.f1_session_status').state || '').toLowerCase();
                  const live = ['live', 'started', 'running', 'active'].some(x => st.includes(x));

                  const lapS = S('sensor.f1_race_lap_count');
                  const lap = Number(lapS.state) || 0;
                  const tot = Number(pick(lapS.attributes || {}, 'total_laps', 'total', 'laps_total', 'TotalLaps')) || 0;
                  const pct = tot ? Math.min(100, Math.round(lap / tot * 100)) : 0;
                  const lapTxt = tot ? `Lap: ${lap}/${tot} <span style="opacity:.7">(${tot - lap} left)</span>` : (lap ? `Lap: ${lap}` : '');

                  const ts = String(S('sensor.f1_track_status').state || '—').toUpperCase();
                  const tsc = ts.includes('RED') ? '#e53935' : (ts.includes('YELLOW') || ts.includes('SC')) ? '#fbc02d' : '#4caf50';

                  const w = S('sensor.f1_track_weather').attributes || {};
                  const wd = Number(w.wind_direction);
                  const dir = isNaN(wd) ? '' : ' ' + ['N','NE','E','SE','S','SW','W','NW'][Math.round(wd / 45) % 8];
                  const rain = Number(w.rainfall);
                  const cell = (l, v) => `<div style="text-align:center"><div style="font-size:11px;opacity:.65;text-transform:uppercase">${l}</div>
                      <div style="font-size:15px;font-weight:700">${v ?? '—'}</div></div>`;

                  return `
                    <div style="display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;
                                padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.15)">
                      ${flag}
                      <div style="text-align:left;overflow:hidden">
                        <div style="font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</div>
                        <div style="font-size:12px;letter-spacing:1px;opacity:.85">${sess}
                          ${live ? '<span style="color:#4caf50;font-weight:700;margin-left:6px">LIVE</span>' : ''}</div>
                      </div>
                      <div style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;
                                  color:${tsc};border:1px solid ${tsc};white-space:nowrap">TRACK ${ts}</div>
                    </div>
                    ${lapTxt ? `<div style="padding:8px 0 2px;text-align:left;font-size:14px">${lapTxt}
                      <div style="height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin-top:4px">
                        <div style="height:4px;border-radius:2px;width:${pct}%;background:#e10600"></div></div></div>` : ''}
                    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px;padding-top:10px">
                      ${cell('Wind', w.wind_speed != null ? w.wind_speed + ' m/s' + dir : null)}
                      ${cell('Track', w.track_temperature != null ? w.track_temperature + ' °C' : null)}
                      ${cell('Air', w.air_temperature != null ? w.air_temperature + ' °C' : null)}
                      ${cell('Humidity', w.humidity != null ? w.humidity + '%' : null)}
                      ${cell('Pressure', pick(w, 'air_pressure', 'pressure') != null ? pick(w, 'air_pressure', 'pressure') + ' mb' : null)}
                      ${cell('Rain', isNaN(rain) ? null : (rain > 0 ? 'Yes' : 'No'))}
                    </div>`;
                ]]]
      - type: grid
        cards:
          - type: heading
            heading: Driver Standings
            heading_style: title
          - type: custom:button-card
            variables:
              righe: 5
            entity: sensor.f1_driver_standings
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - background: 'linear-gradient(180deg, #1c1c2e, #121220)'
                - border-radius: 16px
                - padding: 12px
                - color: white
              grid:
                - grid-template-areas: '"title" "list"'
                - grid-template-columns: 1fr
              custom_fields:
                title:
                  - font-size: 24px
                  - font-weight: 800
                  - letter-spacing: 1px
                  - text-transform: uppercase
                  - padding: 4px 0 10px
                  - border-bottom: 1px solid rgba(255,255,255,0.25)
                  - margin-bottom: 10px
                list:
                  - padding-right: 0px
            custom_fields:
              title: 🏁 Drivers Standings
              list: |
                [[[
                  // Righe: numero fisso oppure un helper input_number (es. 'input_number.f1_righe_piloti')
                  const rows = (v, def) => {
                    if (typeof v === 'string' && v.startsWith('input_number.')) v = states[v]?.state;
                    const n = parseInt(v, 10);
                    return n >= 0 ? n : def;
                  };
                  const a = entity?.attributes || {};
                  const list = a.driver_standings || a.standings || a.DriverStandings || [];
                  if (!list.length) return '<div style="opacity:.7">Nessun dato disponibile</div>';

                  // Colori team (constructorId Jolpica)
                  const colors = {
                    mclaren: '#ff8000', red_bull: '#3671c6', mercedes: '#27f4d2',
                    ferrari: '#e8002d', williams: '#1868db', sauber: '#52e252',
                    audi: '#ff2d00', rb: '#6692ff', haas: '#b6babd',
                    aston_martin: '#229971', alpine: '#ff87bc', cadillac: '#c9c9c9'
                  };

                  // Foto piloti, colore e numero da sensor.f1_driver_list
                  const roster = states['sensor.f1_driver_list']?.attributes?.drivers || [];
                  const byTla = {};
                  roster.forEach(r => { if (r.tla) byTla[r.tla.toUpperCase()] = r; });

                  // Loghi ufficiali F1 per constructorId (fallback: badge locale)
                  const B = 'https://media.formula1.com/image/upload/c_fit,h_64/q_auto/v1740000000/common/f1/2025/';
                  const logos = {
                    red_bull:     B + 'redbullracing/2025redbullracinglogo.webp',
                    ferrari:      B + 'ferrari/2025ferrarilogo.webp',
                    mercedes:     B + 'mercedes/2025mercedeslogowhite.webp',
                    mclaren:      B + 'mclaren/2025mclarenlogo.webp',
                    aston_martin: B + 'astonmartin/2025astonmartinlogowhite.webp',
                    alpine:       B + 'alpine/2025alpinelogo.webp',
                    rb:           B + 'racingbulls/2025racingbullslogowhite.webp',
                    haas:         B + 'haas/2025haaslogo.webp',
                    williams:     B + 'williams/2025williamslogo.webp',
                    sauber:       B + 'kicksauber/2025kicksauberlogo.webp'
                  };

                  // Monoposto ufficiali F1 per constructorId (se manca, lo spazio resta vuoto)
                  const C = 'https://media.formula1.com/image/upload/c_lfill,w_240/q_auto/v1740000000/common/f1/2025/';
                  const cars = {
                    mclaren:      C + 'mclaren/2025mclarencarright.webp',
                    mercedes:     C + 'mercedes/2025mercedescarright.webp',
                    red_bull:     C + 'redbullracing/2025redbullracingcarright.webp',
                    ferrari:      C + 'ferrari/2025ferraricarright.webp',
                    williams:     C + 'williams/2025williamscarright.webp',
                    rb:           C + 'racingbulls/2025racingbullscarright.webp',
                    aston_martin: C + 'astonmartin/2025astonmartincarright.webp',
                    haas:         C + 'haas/2025haascarright.webp',
                    sauber:       C + 'kicksauber/2025kicksaubercarright.webp',
                    alpine:       C + 'alpine/2025alpinecarright.webp'
                  };
                  const CAR_W = window.innerWidth <= 500 ? 64 : 96;

                  const img = (src, fallback, w, round) =>
                    `<img src="${src || fallback}" style="width:${w}px;height:${w}px;
                          object-fit:${round ? 'cover' : 'contain'};${round ? 'border-radius:50%;' : ''}"
                          onerror="if(this.src.indexOf('${fallback}')<0){this.src='${fallback}'}else{this.style.visibility='hidden'}">`;

                  return list.slice(0, rows(variables.righe, 6)).map(d => {
                    const drv  = d.Driver || d.driver || {};
                    const team = (d.Constructors || d.constructors || [])[0] || {};
                    const code = (drv.code || '').toUpperCase();
                    const name = `${drv.givenName || ''} ${drv.familyName || ''}`.trim();
                    const tid  = team.constructorId || '';
                    const live = byTla[code] || {};
                    const tc   = live.team_color ? '#' + String(live.team_color).replace('#','') : null;
                    const c    = tc || colors[tid] || '#888888';
                    const num  = live.racing_number || '';

                    return `
                      <div style="display:grid;grid-template-columns:40px 40px 44px minmax(0,1fr) ${CAR_W}px auto;
                                  align-items:center;gap:8px;margin-bottom:6px;padding:6px 10px;
                                  border-radius:10px;
                                  background:linear-gradient(90deg, ${c}40, ${c}10 60%, transparent)">
                        <div style="font-size:30px;font-weight:700;color:${c};text-align:center">${d.position}</div>
                        <div style="position:relative;width:40px;height:40px">
                          ${img(live.headshot_small, `/local/f1/drivers/${code.toLowerCase()}.png`, 40, true)}
                          ${num ? `<div style="position:absolute;bottom:-4px;right:-4px;font-size:13px;font-weight:900;
                               color:${c};text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000">${num}</div>` : ''}
                        </div>
                        ${img(logos[tid], `/local/f1/teams/${tid}.png`, 44, false)}
                        <div style="text-align:left;line-height:1.2;overflow:hidden">
                          <div style="font-size:15px;font-weight:600;white-space:nowrap;
                                      overflow:hidden;text-overflow:ellipsis">${code} - ${name}</div>
                          <div style="font-size:12px;opacity:.75">${team.name || ''}</div>
                        </div>
                        <div>${cars[tid] ? `<img src="${cars[tid]}" style="width:${CAR_W}px;height:auto;display:block"
                               onerror="this.style.visibility='hidden'">` : ''}</div>
                        <div style="font-size:22px;font-weight:700;white-space:nowrap">
                          ${d.points} <span style="font-size:11px;font-weight:600">PTS</span>
                        </div>
                      </div>`;
                  }).join('');
                ]]]
          - type: heading
            heading: Constructor Standings
            heading_style: title
          - type: custom:button-card
            entity: sensor.f1_constructor_standings
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - background: 'linear-gradient(180deg, #1c1c2e, #121220)'
                - border-radius: 16px
                - padding: 12px
                - color: white
              grid:
                - grid-template-areas: '"title" "list"'
                - grid-template-columns: 1fr
              custom_fields:
                title:
                  - font-size: 24px
                  - font-weight: 800
                  - letter-spacing: 1px
                  - text-transform: uppercase
                  - padding: 4px 0 10px
                  - border-bottom: 1px solid rgba(255,255,255,0.25)
                  - margin-bottom: 10px
            custom_fields:
              title: 🏆 Constructors Standings
              list: |
                [[[
                  const TOP = 5;   // quante scuderie mostrare

                  const a = entity?.attributes || {};
                  const list = a.constructor_standings || a.standings || a.ConstructorStandings || [];
                  if (!list.length) return '<div style="opacity:.7">Nessun dato disponibile</div>';

                  const colors = {
                    mclaren: '#ff8000', red_bull: '#3671c6', mercedes: '#27f4d2',
                    ferrari: '#e8002d', williams: '#1868db', sauber: '#52e252',
                    audi: '#ff2d00', rb: '#6692ff', haas: '#b6babd',
                    aston_martin: '#229971', alpine: '#ff87bc', cadillac: '#c9c9c9'
                  };

                  // Piloti per team (dalla classifica piloti) + colore ufficiale dal roster live
                  const roster = states['sensor.f1_driver_list']?.attributes?.drivers || [];
                  const byTla = {};
                  roster.forEach(r => { if (r.tla) byTla[r.tla.toUpperCase()] = r; });
                  const ds = states['sensor.f1_driver_standings']?.attributes?.driver_standings || [];
                  const teamDrivers = {}, teamColor = {};
                  ds.forEach(d => {
                    const tid = d.Constructors?.[0]?.constructorId;
                    const code = (d.Driver?.code || '').toUpperCase();
                    if (!tid || !code) return;
                    (teamDrivers[tid] = teamDrivers[tid] || []).push(code);
                    const tc = byTla[code]?.team_color;
                    if (tc && !teamColor[tid]) teamColor[tid] = '#' + String(tc).replace('#', '');
                  });

                  const L = 'https://media.formula1.com/image/upload/c_fit,h_64/q_auto/v1740000000/common/f1/2025/';
                  const logos = {
                    red_bull:     L + 'redbullracing/2025redbullracinglogo.webp',
                    ferrari:      L + 'ferrari/2025ferrarilogo.webp',
                    mercedes:     L + 'mercedes/2025mercedeslogowhite.webp',
                    mclaren:      L + 'mclaren/2025mclarenlogo.webp',
                    aston_martin: L + 'astonmartin/2025astonmartinlogowhite.webp',
                    alpine:       L + 'alpine/2025alpinelogo.webp',
                    rb:           L + 'racingbulls/2025racingbullslogowhite.webp',
                    haas:         L + 'haas/2025haaslogo.webp',
                    williams:     L + 'williams/2025williamslogo.webp',
                    sauber:       L + 'kicksauber/2025kicksauberlogo.webp'
                  };

                  const C = 'https://media.formula1.com/image/upload/c_lfill,w_240/q_auto/v1740000000/common/f1/2025/';
                  const cars = {
                    mclaren:      C + 'mclaren/2025mclarencarright.webp',
                    mercedes:     C + 'mercedes/2025mercedescarright.webp',
                    red_bull:     C + 'redbullracing/2025redbullracingcarright.webp',
                    ferrari:      C + 'ferrari/2025ferraricarright.webp',
                    williams:     C + 'williams/2025williamscarright.webp',
                    rb:           C + 'racingbulls/2025racingbullscarright.webp',
                    aston_martin: C + 'astonmartin/2025astonmartincarright.webp',
                    haas:         C + 'haas/2025haascarright.webp',
                    sauber:       C + 'kicksauber/2025kicksaubercarright.webp',
                    alpine:       C + 'alpine/2025alpinecarright.webp'
                  };
                  const CAR_W = window.innerWidth <= 500 ? 64 : 96;

                  const logo = (tid) => {
                    const fb = `/local/f1/teams/${tid}.png`;
                    return `<img src="${logos[tid] || fb}" style="width:44px;height:44px;object-fit:contain"
                              onerror="if(this.src.indexOf('${fb}')<0){this.src='${fb}'}else{this.style.visibility='hidden'}">`;
                  };

                  return list.slice(0, TOP).map(t => {
                    const team = t.Constructor || t.constructor_info || {};
                    const tid  = team.constructorId || '';
                    const c    = teamColor[tid] || colors[tid] || '#888888';
                    const drv  = (teamDrivers[tid] || []).join(' · ');
                    const wins = Number(t.wins || 0);
                    const sub  = [drv, wins ? `${wins} vittori${wins === 1 ? 'a' : 'e'}` : ''].filter(Boolean).join(' · ');

                    return `
                      <div style="display:grid;grid-template-columns:40px 44px minmax(0,1fr) ${CAR_W}px auto;
                                  align-items:center;gap:8px;margin-bottom:6px;padding:6px 10px;
                                  border-radius:10px;
                                  background:linear-gradient(90deg, ${c}40, ${c}10 60%, transparent)">
                        <div style="font-size:30px;font-weight:700;color:${c};text-align:center">${t.position}</div>
                        ${logo(tid)}
                        <div style="text-align:left;line-height:1.2;overflow:hidden">
                          <div style="font-size:15px;font-weight:600;white-space:nowrap;
                                      overflow:hidden;text-overflow:ellipsis">${team.name || ''}</div>
                          <div style="font-size:12px;opacity:.75;white-space:nowrap;
                                      overflow:hidden;text-overflow:ellipsis">${sub}</div>
                        </div>
                        <div>${cars[tid] ? `<img src="${cars[tid]}" style="width:${CAR_W}px;height:auto;display:block"
                               onerror="this.style.visibility='hidden'">` : ''}</div>
                        <div style="font-size:22px;font-weight:700;white-space:nowrap">
                          ${t.points} <span style="font-size:11px;font-weight:600">PTS</span>
                        </div>
                      </div>`;
                  }).join('');
                ]]]
