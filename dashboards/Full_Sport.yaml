              %}| {{ as_timestamp(g.start) | timestamp_custom('%H:%M') }} | {{
              g.away_abbreviation }} {% if g.away_logo %}<img src="{{
              g.away_logo }}" height="20">{% endif %} | {% if g.live %}🔴 **{{
              g.away_score }}-{{ g.home_score }}**<br><small>{{ g.status
              }}</small>{% elif g.final %}**{{ g.away_score }}-{{ g.home_score
              }}**{% else %}@{% endif %} | {% if g.home_logo %}<img src="{{
