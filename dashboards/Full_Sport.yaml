          - type: calendar
            grid_options:
              columns: full
            initial_view: listWeek
            entities:
              - calendar.volley_superlega_calendar
      - type: grid
        cards:
          - type: heading
            heading: Standings
            icon: mdi:podium
          - type: markdown
            grid_options:
              columns: full
            content: >-
              {% set rows = state_attr('sensor.volley_superlega_standings',
              'standings') or [] %}

              | # | Team | Pts | P | W-L | Sets | Form |

              |--:|:--|--:|--:|:-:|:-:|:--|

              {% for r in rows %}| {{ r.position }} | {% if r.badge %}<img
              src="{{ r.badge }}" height="18"> {% endif %}{{ r.team }} | **{{
              r.points }}** | {{ r.played }} | {{ r.won }}-{{ r.lost }} | {{
              r.sets_won }}-{{ r.sets_lost }} | {{ r.form | replace('W', '🟢') |
              replace('L', '🔴') }} |

              {% endfor %}


              <small>Computed from the results: 3 points for a 3-0 or 3-1 win, 2
              for 3-2, 1 for 2-3. Penalties are not included.</small>
      - type: grid
        visibility:
          - condition: state
            entity: sensor.volley_superlega_season
            state:
              - playoffs
              - finished
        cards:
          - type: heading
            heading: Playoffs
            icon: mdi:tournament
          - type: markdown
            grid_options:
              columns: full
            content: >-
              {% set series = state_attr('sensor.volley_superlega_playoffs',
              'series') or [] %}

              {% if not series %}

              No playoff matches on TheSportsDB yet.

              {% endif %}

              {% for s in series %}

              **{{ s.team_a }} {{ s.wins_a }}-{{ s.wins_b }} {{ s.team_b }}**

              <small>{% for m in s.matches %}{{
              as_datetime(m.date).strftime('%-d/%m') }} {{ m.home_team }} {{
              m.score or '-' }} {{ m.away_team }}{{ '' if loop.last else ' · '
              }}{% endfor %}</small>


              {% endfor %}
      - type: grid
        visibility:
          - condition: state
            entity: sensor.volley_superlega_last_round
            state_not: unknown
        cards:
          - type: heading
            heading: Last round
            icon: mdi:calendar-check
          - type: markdown
            grid_options:
              columns: full
            content: >-
              {% set a = states.sensor.volley_superlega_last_round.attributes %}

              ### Round {{ a.round }}


              | | | | |

              |:--|--:|:-:|:--|

              {% for m in a.matches or [] %}| {{
              as_datetime(m.date).strftime('%a %-d/%m') }} | {{ m.home_team }}
              {% if m.home_badge %}<img src="{{ m.home_badge }}" height="18">{%
              endif %} | **{{ m.score or '-' }}** | {% if m.away_badge %}<img
              src="{{ m.away_badge }}" height="18">{% endif %} {{ m.away_team }}
              |

              {% endfor %}


              {% set sets = (a.matches or []) | selectattr('sets') | list %}

              {% if sets %}<small>{% for m in sets %}{{ m.home_team }} - {{
              m.away_team }}: {{ m.sets | join(', ') }}<br>{% endfor
              %}</small>{% endif %}
