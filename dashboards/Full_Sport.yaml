              | | | | |

              |--:|:-:|:--|:--|

              {% for g in a.games or [] %}| {{ g.away_abbreviation }} {% if
              g.away_logo %}<img src="{{ g.away_logo }}" height="20">{% endif %}
              | **{{ g.away_score }}-{{ g.home_score }}** | {% if g.home_logo
              %}<img src="{{ g.home_logo }}" height="20">{% endif %} {{
