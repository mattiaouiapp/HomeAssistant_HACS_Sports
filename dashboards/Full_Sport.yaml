                  const col = r => r?.team_color ? '#' + String(r.team_color).replace('#', '') : '#888888';
                  const tag = r => `<span style="display:inline-flex;align-items:center;gap:6px">
                      <span style="width:4px;height:16px;border-radius:2px;background:${col(r)}"></span>
                      <span style="font-weight:700;color:${col(r)}">${r.tla || '?'}</span></span>`;
                  const firstList = (a, ...keys) => { for (const k of keys) { const l = toList(a[k]); if (l.length) return l; } return []; };
                  const none = '<div style="opacity:.7;text-align:center;padding:8px">Nessun dato disponibile</div>';
                  const row = (inner, extra = '') => `<div style="display:grid;align-items:center;gap:6px;padding:6px 10px;
                      margin-bottom:5px;border-radius:10px;background:rgba(255,255,255,.05);${extra}">${inner}</div>`;

                  const tyreCol = { S:'#e10600', M:'#ffd400', H:'#f0f0f0', I:'#43b02a', W:'#0067ad' };
                  const tyreAttr = states['sensor.f1_current_tyres']?.attributes || {};
                  const tyres = {};
                  firstList(tyreAttr, 'drivers', 'tyres', 'cars', 'current_tyres').forEach(t => {
                    const r = who(t);
                    tyres[r.tla] = t;
                  });
                  const a = entity?.attributes || {};
                  const cars = firstList(a, 'cars', 'drivers', 'pitstops', 'pit_stops', 'stops');
                  if (!cars.length) return none;

                  const fmt = v => (v == null || v === '' || isNaN(Number(v))) ? (v ?? '—') : Number(v).toFixed(1);
                  const head = `<div style="display:grid;grid-template-columns:60px 62px 26px 1fr 1fr;gap:6px;padding:0 10px 4px;
                      font-size:11px;opacity:.6;text-align:center"><div style="text-align:left">TLA</div><div>TYRES</div>
                      <div>ST</div><div>PIT</div><div>LANE</div></div>`;

                  return head + cars.map(c => {
                    const r = who(c);
                    const stops = toList(pick(c, 'stops', 'pitstops', 'pit_stops') || []);
                    const last = stops[stops.length - 1] || c;
                    const n = pick(c, 'count', 'stops_count', 'total') ?? stops.length;
                    const pit = pick(last, 'pit_stop_time', 'stop_time', 'stationary_time', 'duration');
                    const lane = pick(last, 'pit_lane_time', 'lane_time', 'pit_lane_duration');
                    const t = tyres[r.tla] || {};
                    const comp = String(pick(t, 'compound', 'tyre', 'tyre_compound') || '').toUpperCase().charAt(0);
                    const age = pick(t, 'tyre_age', 'age', 'stint_laps', 'laps');
                    const tc = tyreCol[comp] || '#777';
                    const tyre = comp ? `<span style="display:inline-flex;align-items:center;gap:4px">
                        <span style="width:20px;height:20px;border-radius:50%;border:2px solid ${tc};color:${tc};font-size:11px;
                                     font-weight:900;display:inline-flex;align-items:center;justify-content:center">${comp}</span>
                        <span style="font-size:12px">${age ?? ''}</span></span>` : '—';
                    return row(`${tag(r)}<div style="text-align:center">${tyre}</div>
                        <div style="text-align:center">${n}</div><div style="text-align:center">${fmt(pit)}</div>
                        <div style="text-align:center">${fmt(lane)}</div>`,
                      'grid-template-columns:60px 62px 26px 1fr 1fr;font-size:14px');
                  }).join('');
                ]]]
      - type: custom:button-card
        entity: sensor.f1_driver_positions
        triggers_update:
          - sensor.f1_driver_list
          - sensor.f1_current_tyres
          - sensor.f1_race_lap_count
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: none
        styles:
          card:
            - background: 'linear-gradient(180deg, #1c1c2e, #121220)'
            - border-radius: 16px
            - padding: 12px
            - color: white
          grid:
            - grid-template-areas: '"title" "list"'
            - grid-template-columns: 1fr
          custom_fields:
            title:
              - padding: 2px 0 8px
              - margin-bottom: 8px
              - border-bottom: 1px solid rgba(255,255,255,0.2)
        custom_fields:
          title: |
            [[[
              const lapS = states['sensor.f1_race_lap_count'] || {};
              const lap = Number(lapS.state) || 0;
              const tot = Number((lapS.attributes || {}).total_laps || (lapS.attributes || {}).total) || 0;
              const lapTxt = lap ? `LAP ${lap}${tot ? '/' + tot : ''}` : '';
              return `<div style="display:flex;justify-content:space-between;align-items:center">
                  <span style="font-size:22px;font-weight:800;letter-spacing:1px">🏎️ LIVE POSITIONS</span>
                  <span style="font-size:13px;font-weight:700;opacity:.85">${lapTxt}</span></div>`;
            ]]]
          list: |
            [[[
              const MAX = 10;   // quanti piloti mostrare (es. 10 per la top 10)

              const toList = v => Array.isArray(v) ? v
                : (v && typeof v === 'object')
                  ? Object.entries(v).map(([k, x]) => (x && typeof x === 'object') ? { _key: k, ...x } : { _key: k, value: x })
                  : [];
              const pick = (o, ...keys) => { for (const k of keys) if (o && o[k] != null && o[k] !== '') return o[k]; return undefined; };

              // Roster: TLA, colore, foto, numero
              const roster = states['sensor.f1_driver_list']?.attributes?.drivers || [];
              const byNum = {}, byTla = {};
              toList(roster).forEach(r => {
                if (r.racing_number != null) byNum[String(r.racing_number)] = r;
                if (r.tla) byTla[String(r.tla).toUpperCase()] = r;
              });
              const who = o => {
                const t = String(pick(o, 'tla', 'driver_tla', 'code') || '').toUpperCase();
                const n = String(pick(o, 'racing_number', 'driver_number', 'number', 'car', '_key') ?? '');
                return byTla[t] || byNum[n] || { tla: t || n, racing_number: n };
              };

              // Gomme attuali
              const tyreAttr = states['sensor.f1_current_tyres']?.attributes || {};
              const tyres = {};
              for (const k of ['drivers', 'tyres', 'cars', 'current_tyres']) {
                const l = toList(tyreAttr[k]); if (l.length) { l.forEach(t => { tyres[who(t).tla] = t; }); break; }
              }
              const tyreCol = { S:'#e10600', M:'#ffd400', H:'#f0f0f0', I:'#43b02a', W:'#0067ad' };

              // Posizioni
              const a = entity?.attributes || {};
              let cars = [];
              for (const k of ['drivers', 'positions', 'cars', 'driver_positions', 'order']) {
                cars = toList(a[k]); if (cars.length) break;
              }
              if (!cars.length) return '<div style="opacity:.7;text-align:center;padding:8px">Nessun dato: le posizioni live arrivano solo durante una sessione</div>';

              const posOf = c => Number(pick(c, 'position', 'pos', 'Position', 'line')) || 99;
              cars.sort((x, y) => posOf(x) - posOf(y));

              const small = window.innerWidth <= 500;
              const fmtGap = (v, first) => {
                if (first) return 'LEADER';
                if (v == null || v === '') return '';
                const s = String(v);
                return /^[+\-]|LAP|L$/i.test(s) ? s : '+' + s;
              };

              return cars.slice(0, MAX).map(c => {
                const r = who(c);
                const pos = posOf(c);
                const color = r.team_color ? '#' + String(r.team_color).replace('#', '') : '#888888';
                const name = pick(r, 'last_name', 'broadcast_name', 'full_name') || '';
                const gap = fmtGap(pick(c, 'gap_to_leader', 'gap', 'GapToLeader', 'time_diff_to_fastest'), pos === 1);
                const intv = pos === 1 ? '' : fmtGap(pick(c, 'interval', 'interval_to_ahead', 'IntervalToPositionAhead', 'time_diff_to_ahead'), false);
                const last = pick(c, 'last_lap', 'last_lap_time', 'LastLapTime');
                const pit = !!pick(c, 'in_pit', 'pit', 'InPit', 'pit_out');
                const out = !!pick(c, 'retired', 'stopped', 'Retired', 'dnf') || String(pick(c, 'status') || '').toUpperCase().includes('OUT');
                const fast = !!pick(c, 'fastest_lap', 'personal_fastest', 'overall_fastest');
                const t = tyres[r.tla] || {};
                const comp = String(pick(t, 'compound', 'tyre', 'tyre_compound') || '').toUpperCase().charAt(0);
                const age = pick(t, 'tyre_age', 'age', 'stint_laps', 'laps');
                const tc = tyreCol[comp] || '#777';
                const photo = r.headshot_small
                  ? `<img src="${r.headshot_small}" style="width:30px;height:30px;border-radius:50%;object-fit:cover;background:${color}33">`
                  : `<div style="width:30px;height:30px;border-radius:50%;background:${color}55"></div>`;
                const badge = out ? '<span style="font-size:10px;font-weight:800;color:#ef5350">OUT</span>'
                  : pit ? '<span style="font-size:10px;font-weight:800;color:#29b6f6">PIT</span>' : '';

                return `
                  <div style="display:grid;grid-template-columns:28px 4px 30px minmax(0,1fr) ${small ? '' : '64px '}54px 34px;
                              align-items:center;gap:6px;margin-bottom:4px;padding:4px 8px;border-radius:8px;
                              ${out ? 'opacity:.45;' : ''}
                              background:linear-gradient(90deg, ${color}33, ${color}08 60%, transparent)">
                    <div style="font-size:18px;font-weight:800;text-align:center">${pos === 99 ? '–' : pos}</div>
                    <div style="height:22px;border-radius:2px;background:${color}"></div>
                    ${photo}
                    <div style="text-align:left;line-height:1.15;overflow:hidden">
                      <div style="font-size:14px;font-weight:700;white-space:nowrap">${r.tla || ''}
                        <span style="font-weight:400;opacity:.7;font-size:12px">${small ? '' : name}</span>
                        ${fast ? '<span style="color:#b388ff;font-size:11px"> ⏱</span>' : ''} ${badge}</div>
                      ${last && !small ? `<div style="font-size:11px;opacity:.6">${last}</div>` : ''}
                    </div>
                    ${small ? '' : `<div style="font-size:12px;text-align:right;opacity:.75;white-space:nowrap">${intv}</div>`}
                    <div style="font-size:13px;font-weight:700;text-align:right;white-space:nowrap">${small ? (intv || gap) : gap}</div>
                    <div style="text-align:center">${comp ? `<span style="display:inline-flex;align-items:center;justify-content:center;
                        width:20px;height:20px;border-radius:50%;border:2px solid ${tc};color:${tc};font-size:10px;font-weight:900"
                        title="${age ?? ''} giri">${comp}</span>` : ''}</div>
                  </div>`;
              }).join('');
            ]]]
