              {% set e = 'sensor.nba_season' %}

              {% set status = states(e) %}

              {% set today = states('sensor.nba_games_today') | int(0) %}

              {% set live = state_attr(e, 'live_games') | int(0) %}

              <img src="{{ state_attr(e, 'logo') }}" height="56">


              {% if status == 'preseason' %}

              ## Precampionato {{ state_attr(e, 'season') }}

              {% elif status == 'regular_season' %}

              ## Regular season {{ state_attr(e, 'season') }}

              {% elif status == 'play_in' %}

              ## Play-in {{ state_attr(e, 'season') }}

              {% elif status == 'playoffs' %}

              ## Playoff {{ state_attr(e, 'season') }}

              {% else %}

              ## NBA fuori stagione

              {% endif %}


              {% if live %}🔴 **{{ live }} partit{{ 'a' if live == 1 else 'e' }}
              in corso** · {% endif %}{% if today %}**{{ today }}** partit{{ 'a'
              if today == 1 else 'e' }} nella notte{% else %}Nessuna partita in
              programma stanotte{% endif %}

              {%- if states('sensor.nba_east_standings') not in ['unknown',
              'unavailable'] %} · in testa **{{
              state_attr('sensor.nba_east_standings',
              'standings')[0].abbreviation }}** a Est e **{{
              state_attr('sensor.nba_west_standings',
              'standings')[0].abbreviation }}** a Ovest{% endif %}.
          - type: tile
            entity: sensor.nba_next_game
            name: Prossima partita
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.nba_game_live
            name: In corso
            grid_options:
              columns: 6
        column_span: 1
        background:
