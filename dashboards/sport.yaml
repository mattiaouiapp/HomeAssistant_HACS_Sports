      - type: grid
        cards:
          - type: heading
            heading: New section
          - type: custom:button-card
            entity: sensor.f1_session_status
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - background: 'linear-gradient(180deg, #1c1c2e, #121220)'
                - border-radius: 16px
                - padding: 12px
                - color: white
              grid:
                - grid-template-areas: '"main"'
                - grid-template-columns: 1fr
              custom_fields: null
            custom_fields:
              main: |
                [[[
                  const roster = states['sensor.f1_driver_list']?.attributes?.drivers || [];
                  const byNum = {}, byTla = {};
                  roster.forEach(r => {
                    if (r.racing_number != null) byNum[String(r.racing_number)] = r;
                    if (r.tla) byTla[String(r.tla).toUpperCase()] = r;
                  });
                  const toList = v => Array.isArray(v) ? v
                    : (v && typeof v === 'object')
                      ? Object.entries(v).map(([k, x]) => (x && typeof x === 'object') ? { _key: k, ...x } : { _key: k, value: x })
                      : [];
                  const pick = (o, ...keys) => { for (const k of keys) if (o && o[k] != null && o[k] !== '') return o[k]; return undefined; };
                  const who = o => {
                    const t = String(pick(o, 'tla', 'driver_tla', 'code', 'driver') || '').toUpperCase();
                    const n = String(pick(o, 'racing_number', 'driver_number', 'number', 'car', 'car_number', '_key') ?? '');
                    return byTla[t] || byNum[n] || byTla[n.toUpperCase()] || { tla: t.length === 3 ? t : n };
                  };
                  const col = r => r?.team_color ? '#' + String(r.team_color).replace('#', '') : '#888888';
                  const tag = r => `<span style="display:inline-flex;align-items:center;gap:6px">
                      <span style="width:4px;height:16px;border-radius:2px;background:${col(r)}"></span>
                      <span style="font-weight:700;color:${col(r)}">${r.tla || '?'}</span></span>`;
                  const firstList = (a, ...keys) => { for (const k of keys) { const l = toList(a[k]); if (l.length) return l; } return []; };
                  const none = '<div style="opacity:.7;text-align:center;padding:8px">Nessun dato disponibile</div>';
                  const row = (inner, extra = '') => `<div style="display:grid;align-items:center;gap:6px;padding:6px 10px;
                      margin-bottom:5px;border-radius:10px;background:rgba(255,255,255,.05);${extra}">${inner}</div>`;

                  const S = id => states[id] || {};
                  const nr = S('sensor.f1_next_race').attributes || {};
                  const name = (pick(nr, 'race_name', 'raceName', 'name') || 'Grand Prix').replace('Grand Prix', 'GP');
                  const country = pick(nr, 'country', 'circuit_country') || nr.Circuit?.Location?.country || '';
                  const iso = { 'Australia':'au','China':'cn','Japan':'jp','Bahrain':'bh','Saudi Arabia':'sa','USA':'us',
                    'United States':'us','Italy':'it','Monaco':'mc','Spain':'es','Canada':'ca','Austria':'at','UK':'gb',
                    'United Kingdom':'gb','Great Britain':'gb','Belgium':'be','Hungary':'hu','Netherlands':'nl',
                    'Azerbaijan':'az','Singapore':'sg','Mexico':'mx','Brazil':'br','Qatar':'qa','UAE':'ae',
                    'United Arab Emirates':'ae','Abu Dhabi':'ae','Portugal':'pt' };
                  const cc = iso[country];
                  const flag = cc ? `<img src="https://flagcdn.com/w80/${cc}.png" style="width:34px;height:23px;object-fit:cover;border-radius:3px">` : '';

                  const sess = String(S('sensor.f1_current_session').state || '—').toUpperCase();
                  const st = String(S('sensor.f1_session_status').state || '').toLowerCase();
                  const live = ['live', 'started', 'running', 'active'].some(x => st.includes(x));

                  const lapS = S('sensor.f1_race_lap_count');
                  const lap = Number(lapS.state) || 0;
                  const tot = Number(pick(lapS.attributes || {}, 'total_laps', 'total', 'laps_total', 'TotalLaps')) || 0;
                  const pct = tot ? Math.min(100, Math.round(lap / tot * 100)) : 0;
                  const lapTxt = tot ? `Lap: ${lap}/${tot} <span style="opacity:.7">(${tot - lap} left)</span>` : (lap ? `Lap: ${lap}` : '');

                  const ts = String(S('sensor.f1_track_status').state || '—').toUpperCase();
                  const tsc = ts.includes('RED') ? '#e53935' : (ts.includes('YELLOW') || ts.includes('SC')) ? '#fbc02d' : '#4caf50';

                  const w = S('sensor.f1_track_weather').attributes || {};
                  const wd = Number(w.wind_direction);
                  const dir = isNaN(wd) ? '' : ' ' + ['N','NE','E','SE','S','SW','W','NW'][Math.round(wd / 45) % 8];
                  const rain = Number(w.rainfall);
                  const cell = (l, v) => `<div style="text-align:center"><div style="font-size:11px;opacity:.65;text-transform:uppercase">${l}</div>
                      <div style="font-size:15px;font-weight:700">${v ?? '—'}</div></div>`;

                  return `
                    <div style="display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;
                                padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.15)">
                      ${flag}
                      <div style="text-align:left;overflow:hidden">
                        <div style="font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</div>
                        <div style="font-size:12px;letter-spacing:1px;opacity:.85">${sess}
                          ${live ? '<span style="color:#4caf50;font-weight:700;margin-left:6px">LIVE</span>' : ''}</div>
                      </div>
                      <div style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;
                                  color:${tsc};border:1px solid ${tsc};white-space:nowrap">TRACK ${ts}</div>
                    </div>
                    ${lapTxt ? `<div style="padding:8px 0 2px;text-align:left;font-size:14px">${lapTxt}
                      <div style="height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin-top:4px">
                        <div style="height:4px;border-radius:2px;width:${pct}%;background:#e10600"></div></div></div>` : ''}
                    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px;padding-top:10px">
                      ${cell('Wind', w.wind_speed != null ? w.wind_speed + ' m/s' + dir : null)}
                      ${cell('Track', w.track_temperature != null ? w.track_temperature + ' °C' : null)}
                      ${cell('Air', w.air_temperature != null ? w.air_temperature + ' °C' : null)}
                      ${cell('Humidity', w.humidity != null ? w.humidity + '%' : null)}
                      ${cell('Pressure', pick(w, 'air_pressure', 'pressure') != null ? pick(w, 'air_pressure', 'pressure') + ' mb' : null)}
                      ${cell('Rain', isNaN(rain) ? null : (rain > 0 ? 'Yes' : 'No'))}
                    </div>`;
                ]]]
