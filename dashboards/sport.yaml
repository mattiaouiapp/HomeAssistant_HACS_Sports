              - type: grid
                columns: 2
                square: false
                cards:
                  - type: custom:button-card
                    show_state: true
                    variables:
                      bg: 'linear-gradient(135deg, #7b3fd4, #5a2db0)'
                    tap_action:
                      action: more-info
                    state_display: >
                      [[[ return entity ? String(entity.state).toUpperCase() :
