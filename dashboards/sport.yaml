                    entity: sensor.f1_current_session
                    name: Current Session
                    icon: mdi:flag-checkered
                  - type: custom:button-card
                    show_state: true
                    variables:
                      bg: 'linear-gradient(135deg, #3a3a3a, #1f1f1f)'
                    tap_action:
                      action: more-info
                    state_display: >
                      [[[ return entity ? String(entity.state).toUpperCase() :
