                            [[[
                              const s = (entity?.state || '').toUpperCase();
                              if (s.includes('RED')) return 'linear-gradient(135deg,#e53935,#b71c1c)';
                              if (s.includes('YELLOW') || s.includes('SC')) return 'linear-gradient(135deg,#fbc02d,#f57f17)';
