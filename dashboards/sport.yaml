                  - text-transform: uppercase
                  - text-align: center
                  - padding: 2px 0 8px
                  - margin-bottom: 8px
                  - border-bottom: 1px solid rgba(255,255,255,0.2)
            custom_fields:
              title: Pit stops & tyres
              list: |
                [[[
                  const roster = states['sensor.f1_driver_list']?.attributes?.drivers || [];
                  const byNum = {}, byTla = {};
                  roster.forEach(r => {
                    if (r.racing_number != null) byNum[String(r.racing_number)] = r;
                    if (r.tla) byTla[String(r.tla).toUpperCase()] = r;
                  });
                  const toList = v => Array.isArray(v) ? v
                    : (v && typeof v === 'object')
                      ? Object.entries(v).map(([k, x]) => (x && typeof x === 'object') ? { _key: k, ...x } : { _key: k, value: x })
                      : [];
                  const pick = (o, ...keys) => { for (const k of keys) if (o && o[k] != null && o[k] !== '') return o[k]; return undefined; };
                  const who = o => {
                    const t = String(pick(o, 'tla', 'driver_tla', 'code', 'driver') || '').toUpperCase();
                    const n = String(pick(o, 'racing_number', 'driver_number', 'number', 'car', 'car_number', '_key') ?? '');
                    return byTla[t] || byNum[n] || byTla[n.toUpperCase()] || { tla: t.length === 3 ? t : n };
                  };
                  const col = r => r?.team_color ? '#' + String(r.team_color).replace('#', '') : '#888888';
                  const tag = r => `<span style="display:inline-flex;align-items:center;gap:6px">
                      <span style="width:4px;height:16px;border-radius:2px;background:${col(r)}"></span>
                      <span style="font-weight:700;color:${col(r)}">${r.tla || '?'}</span></span>`;
                  const firstList = (a, ...keys) => { for (const k of keys) { const l = toList(a[k]); if (l.length) return l; } return []; };
                  const none = '<div style="opacity:.7;text-align:center;padding:8px">Nessun dato disponibile</div>';
                  const row = (inner, extra = '') => `<div style="display:grid;align-items:center;gap:6px;padding:6px 10px;
                      margin-bottom:5px;border-radius:10px;background:rgba(255,255,255,.05);${extra}">${inner}</div>`;

                  const tyreCol = { S:'#e10600', M:'#ffd400', H:'#f0f0f0', I:'#43b02a', W:'#0067ad' };
                  const tyreAttr = states['sensor.f1_current_tyres']?.attributes || {};
                  const tyres = {};
                  firstList(tyreAttr, 'drivers', 'tyres', 'cars', 'current_tyres').forEach(t => {
                    const r = who(t);
                    tyres[r.tla] = t;
                  });
                  const a = entity?.attributes || {};
                  const cars = firstList(a, 'cars', 'drivers', 'pitstops', 'pit_stops', 'stops');
                  if (!cars.length) return none;

                  const fmt = v => (v == null || v === '' || isNaN(Number(v))) ? (v ?? '—') : Number(v).toFixed(1);
                  const head = `<div style="display:grid;grid-template-columns:60px 62px 26px 1fr 1fr;gap:6px;padding:0 10px 4px;
                      font-size:11px;opacity:.6;text-align:center"><div style="text-align:left">TLA</div><div>TYRES</div>
                      <div>ST</div><div>PIT</div><div>LANE</div></div>`;

                  return head + cars.map(c => {
                    const r = who(c);
                    const stops = toList(pick(c, 'stops', 'pitstops', 'pit_stops') || []);
                    const last = stops[stops.length - 1] || c;
                    const n = pick(c, 'count', 'stops_count', 'total') ?? stops.length;
                    const pit = pick(last, 'pit_stop_time', 'stop_time', 'stationary_time', 'duration');
                    const lane = pick(last, 'pit_lane_time', 'lane_time', 'pit_lane_duration');
                    const t = tyres[r.tla] || {};
                    const comp = String(pick(t, 'compound', 'tyre', 'tyre_compound') || '').toUpperCase().charAt(0);
                    const age = pick(t, 'tyre_age', 'age', 'stint_laps', 'laps');
                    const tc = tyreCol[comp] || '#777';
                    const tyre = comp ? `<span style="display:inline-flex;align-items:center;gap:4px">
                        <span style="width:20px;height:20px;border-radius:50%;border:2px solid ${tc};color:${tc};font-size:11px;
                                     font-weight:900;display:inline-flex;align-items:center;justify-content:center">${comp}</span>
                        <span style="font-size:12px">${age ?? ''}</span></span>` : '—';
                    return row(`${tag(r)}<div style="text-align:center">${tyre}</div>
