                    styles:
                      card:
                        - background: '[[[ return variables.bg ]]]'
                        - border-radius: 16px
                        - padding: 14px 6px
                        - height: 90px
                        - color: white
                        - box-shadow: none
                      grid:
                        - grid-template-areas: '"i n" "s s"'
                        - grid-template-columns: auto auto
                        - justify-content: center
                        - column-gap: 8px
                        - row-gap: 6px
                      icon:
                        - color: white
                        - width: 22px
                      name:
                        - font-size: 15px
                        - font-weight: 600
                      state:
